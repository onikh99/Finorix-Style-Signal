<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finorix Pro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-bar">
    <div class="logo">
        <span>FINORIX</span>
        <small>PRO</small>
    </div>

    <div class="status">
        <span class="status-dot"></span>
        <span>LIVE</span>
    </div>
</header>


<main class="container">

    <!-- Market -->
    <section class="market-section">

        <div class="section-title">
            <h2>Market</h2>
            <span id="marketStatus">Connected</span>
        </div>

        <select id="marketSelect">
            <option value="EURUSD">EUR/USD</option>
            <option value="GBPUSD">GBP/USD</option>
            <option value="USDJPY">USD/JPY</option>
            <option value="AUDUSD">AUD/USD</option>
            <option value="USDCAD">USD/CAD</option>
            <option value="USDCHF">USD/CHF</option>
        </select>

    </section>


    <!-- Price -->
    <section class="market-card">

        <div class="market-name">
            <span id="currentMarket">EUR/USD</span>
            <small>MARKET</small>
        </div>

        <div class="price">
            <span id="marketPrice">1.08542</span>
        </div>

        <div class="change">
            <span id="priceChange">+0.00012</span>
        </div>

    </section>


    <!-- Candlestick Chart -->
    <section class="chart-card">

        <div class="card-header">
            <h3>Price Chart</h3>
            <span>1M</span>
        </div>

        <div class="chart-wrapper">
            <canvas id="candleChart"></canvas>
        </div>

    </section>


    <!-- Signal -->
    <section class="signal-card">

        <div class="card-header">
            <h3>Finorix Signal</h3>
            <span id="signalTime">--:--</span>
        </div>

        <div class="signal-box">

            <div class="signal-icon" id="signalIcon">
                —
            </div>

            <div class="signal-text">
                <strong id="signal">WAIT</strong>

                <span id="signalDescription">
                    Analyzing market...
                </span>
            </div>

        </div>

    </section>


    <!-- Information -->
    <section class="info-grid">

        <div class="info-box">
            <small>CONFIDENCE</small>
            <strong id="confidence">--%</strong>
        </div>

        <div class="info-box">
            <small>TIMEFRAME</small>
            <strong>1 MIN</strong>
        </div>

        <div class="info-box">
            <small>STATUS</small>
            <strong id="systemStatus">READY</strong>
        </div>

    </section>

</main>


<footer>
    <p>Finorix Pro © 2026</p>
    <p>Market analysis & signal interface</p>
</footer>


<script src="app.js"></script>

</body>
</html>
